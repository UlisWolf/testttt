<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>APV Rouen — Étiquettes</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --bg:#07080c; --surf:#0d0f16; --card:#11141d;
    --bord:#1c2030; --bord2:#252a3a;
    --gold:#f5c518; --ga:rgba(245,197,24,.12);
    --green:#16c784; --red:#f6465d;
    --text:#eef0f6; --dim:#9ca3af; --muted:#4a5168;
    --font:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --mono:'Courier New',monospace;
    --r:18px;
  }
  html,body{height:100%;}
  body{
    background:var(--bg);color:var(--text);font-family:var(--font);
    min-height:100dvh;display:flex;flex-direction:column;align-items:center;
    padding-bottom:54px;
  }

  /* ── HEADER APP ── */
  .hdr{
    width:100%;max-width:480px;display:flex;align-items:center;
    justify-content:space-between;padding:16px 16px 14px;
    border-bottom:1px solid var(--bord);
  }
  .hdr-logo{height:54px;width:auto;display:block;}
  .hdr-right{display:flex;align-items:center;gap:10px;}
  .badge-rc{
    background:var(--ga);border:1.5px solid var(--gold);color:var(--gold);
    font-size:11px;font-weight:800;padding:4px 10px;border-radius:7px;letter-spacing:1.5px;
  }
  .gear{
    background:var(--card);border:1px solid var(--bord);color:var(--muted);
    cursor:pointer;font-size:16px;width:36px;height:36px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    transition:color .2s,border-color .2s;
  }
  .gear:hover{color:var(--gold);border-color:var(--gold);}

  /* ── APP ── */
  .app{width:100%;max-width:480px;padding:14px;display:flex;flex-direction:column;gap:11px;}

  /* ── OR CELLS ── */
  .or-wrap{
    background:var(--card);border:1px solid var(--bord);border-radius:var(--r);
    padding:14px 12px;display:flex;gap:6px;justify-content:center;
  }
  .or-cell{
    flex:1;max-width:54px;height:62px;background:var(--surf);
    border-radius:12px;border:1.5px solid var(--bord);
    display:flex;align-items:center;justify-content:center;
    font-size:28px;font-weight:800;font-family:var(--mono);
    color:var(--text);position:relative;transition:border-color .15s,background .15s;
  }
  .or-cell.empty{color:rgba(156,163,175,.22);font-size:20px;}
  .or-cell.active{border-color:var(--gold);box-shadow:0 0 0 3px rgba(245,197,24,.1);}
  .or-cell.active::after{
    content:'';position:absolute;bottom:9px;width:14px;height:2px;
    background:var(--gold);border-radius:1px;animation:blink 1s step-end infinite;
  }
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

  /* ════════════════════════════════════════
     ÉTIQUETTE — réplique fidèle du ZPL imprimé
     298×150px = 105×53mm @ 72dpi
  ════════════════════════════════════════ */
  .preview-card{
    background:var(--card);border:1px solid var(--bord);border-radius:var(--r);
    padding:16px 14px;display:flex;flex-direction:column;align-items:center;gap:11px;
  }
  .preview-chip{
    align-self:flex-start;font-size:9px;font-weight:700;letter-spacing:1.4px;
    text-transform:uppercase;color:var(--muted);
  }
  .label{
    width:298px;height:150px;background:#fff;color:#000;
    border-radius:5px;overflow:hidden;
    box-shadow:0 2px 5px rgba(0,0,0,.15),0 10px 30px rgba(0,0,0,.5);
    display:flex;flex-direction:column;
    font-family:'Arial Black',Arial,Helvetica,sans-serif;
  }
  /* bandeau : 37px (=13mm) */
  .lb-hdr{
    height:37px;flex-shrink:0;display:flex;align-items:center;
    justify-content:space-between;padding:0 8px;
  }
  .lb-logo{height:30px;width:auto;display:block;}
  .lb-rc{
    min-width:40px;height:28px;padding:0 4px;border:2.5px solid #000;border-radius:3px;
    display:flex;align-items:center;justify-content:center;
    font-size:14px;font-weight:900;letter-spacing:.5px;
    font-family:'Arial Black',Arial,sans-serif;flex-shrink:0;
  }
  /* trait épais (=8 dots ≈ 3px) */
  .lb-sep-h{height:3px;background:#000;flex-shrink:0;}
  /* corps OR centré */
  .lb-body{
    flex:1;display:flex;align-items:center;justify-content:center;
    overflow:hidden;padding:0 6px;
  }
  .lb-or{
    font-family:'Arial Black',Arial,sans-serif;font-weight:900;
    color:#000;line-height:1;white-space:nowrap;text-align:center;
  }
  .lb-or.ph{color:#dcdcdc;font-size:24px;letter-spacing:6px;}
  /* trait fin (=3 dots ≈ 1.5px) */
  .lb-sep-f{height:1.5px;background:#000;flex-shrink:0;}
  /* pied : reste de l'espace */
  .lb-ftr{
    height:26px;flex-shrink:0;display:flex;align-items:center;
    justify-content:space-between;padding:0 8px;
  }
  .lb-ordre{
    font-size:6px;font-weight:700;color:#000;letter-spacing:1.8px;
    text-transform:uppercase;font-family:Arial,sans-serif;
  }
  .lb-date{
    font-size:7.5px;color:#000;font-weight:700;
    font-family:'Courier New',monospace;letter-spacing:.2px;
  }

  /* ── COPIES ── */
  .copies{
    display:flex;align-items:center;gap:14px;background:var(--card);
    border:1px solid var(--bord);border-radius:var(--r);padding:12px 16px;
  }
  .qty-btn{
    width:50px;height:50px;border-radius:13px;border:none;
    font-size:26px;font-weight:600;cursor:pointer;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    transition:transform .1s;-webkit-tap-highlight-color:transparent;
  }
  .qty-btn:active{transform:scale(.88);}
  .qty-m{background:rgba(255,255,255,.07);color:var(--text);}
  .qty-p{background:var(--ga);color:var(--gold);border:1px solid rgba(245,197,24,.3);}
  .qty-c{flex:1;text-align:center;}
  .qty-n{font-size:36px;font-weight:800;line-height:1;}
  .qty-l{font-size:11px;color:var(--muted);margin-top:3px;}

  /* ── NUMPAD ── */
  .numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .nk{
    min-height:60px;background:var(--card);border:1px solid var(--bord);
    border-radius:14px;color:var(--text);font-size:22px;font-weight:600;
    font-family:var(--font);cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    user-select:none;-webkit-tap-highlight-color:transparent;
    transition:background .08s,transform .08s;
  }
  .nk:active,.nk.hit{background:rgba(245,197,24,.14);transform:scale(.94);}
  .nk.del{font-size:19px;color:var(--dim);}
  .nk.ghost{background:transparent;border-color:transparent;pointer-events:none;}

  /* ── SEND ── */
  .send{
    width:100%;height:60px;border-radius:16px;border:none;
    font-size:16px;font-weight:700;font-family:var(--font);cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;
    transition:all .18s;letter-spacing:.3px;-webkit-tap-highlight-color:transparent;
  }
  .send.ready{background:var(--gold);color:#000;box-shadow:0 4px 22px rgba(245,197,24,.4);}
  .send.ready:active{transform:scale(.97);box-shadow:none;}
  .send.off{background:var(--card);border:1px solid var(--bord);color:var(--muted);cursor:not-allowed;}
  .send.busy{background:var(--ga);border:1px solid var(--gold);color:var(--gold);cursor:not-allowed;}
  .spin{
    width:18px;height:18px;border:2.5px solid rgba(245,197,24,.3);
    border-top-color:var(--gold);border-radius:50%;animation:rot .7s linear infinite;
  }
  @keyframes rot{to{transform:rotate(360deg)}}

  /* ── HISTORY ── */
  .hist-wrap{display:flex;flex-direction:column;gap:8px;}
  .hist-hdr{display:flex;align-items:center;justify-content:space-between;}
  .hist-ttl{font-size:9px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);}
  .clr-all{background:none;border:none;color:var(--red);font-size:11px;cursor:pointer;font-family:var(--font);}
  .hist-list{display:flex;flex-direction:column;gap:5px;}
  .hi{
    background:var(--card);border:1px solid var(--bord);border-radius:12px;
    padding:11px 14px;display:flex;align-items:center;gap:11px;
  }
  .hi-dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0;}
  .hi-or{font-family:var(--mono);font-size:16px;font-weight:700;flex:1;letter-spacing:2px;}
  .hi-qty{font-size:12px;color:var(--dim);background:rgba(255,255,255,.05);padding:2px 9px;border-radius:6px;}
  .hi-t{font-size:11px;color:var(--muted);min-width:38px;text-align:right;}
  .hi-del{background:none;border:none;color:rgba(255,255,255,.18);font-size:17px;cursor:pointer;padding:0 0 0 4px;transition:color .15s;font-family:var(--font);}
  .hi-del:hover{color:var(--red);}
  .hist-empty{text-align:center;color:var(--muted);font-size:13px;padding:18px 0;}

  /* ── TOAST ── */
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(90px);
    background:#181c28;border:1px solid rgba(255,255,255,.1);color:var(--text);
    padding:13px 22px;border-radius:14px;font-size:13px;font-weight:600;
    white-space:nowrap;z-index:1000;
    transition:transform .3s cubic-bezier(.34,1.56,.64,1);
    box-shadow:0 8px 32px rgba(0,0,0,.55);
  }
  .toast.show{transform:translateX(-50%) translateY(0);}
  .toast.ok{border-color:var(--green);}
  .toast.err{border-color:var(--red);}

  /* ── MODAL ── */
  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(4px);
    z-index:500;display:none;align-items:flex-end;justify-content:center;
  }
  .overlay.open{display:flex;}
  .modal{
    background:#181b26;border-radius:24px 24px 0 0;border-top:1px solid var(--bord);
    padding:22px 20px 44px;width:100%;max-width:480px;
    animation:up .28s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .m-title{font-size:16px;font-weight:700;margin-bottom:16px;}
  .m-lbl{font-size:11px;color:var(--muted);margin-bottom:6px;display:block;}
  .m-in{
    width:100%;background:rgba(255,255,255,.06);border:1px solid var(--bord);
    border-radius:10px;color:var(--text);font-size:11px;font-family:var(--mono);
    padding:11px 12px;margin-bottom:16px;outline:none;word-break:break-all;
  }
  .m-in:focus{border-color:var(--gold);}
  .m-close{
    width:100%;height:50px;background:var(--ga);border:1.5px solid var(--gold);
    color:var(--gold);border-radius:14px;font-size:15px;font-weight:700;
    cursor:pointer;font-family:var(--font);
  }
</style>
</head>

<div class="app">

  <div class="or-wrap" id="orWrap"></div>

  <div class="preview-card">
    <span class="preview-chip">Aperçu impression — 105 × 53 mm</span>
    <div class="label">

        <div class="lb-rc">RC</div>
      </div>
      <div class="lb-sep-h"></div>
      <div class="lb-body">
        <div class="lb-or ph" id="prevOR">— — — — — —</div>
      </div>
      <div class="lb-sep-f"></div>
      <div class="lb-ftr">
        <span class="lb-ordre">Ordre de réparation</span>
        <span class="lb-date" id="prevDate"></span>
      </div>
    </div>
  </div>

  <div class="copies">
    <button class="qty-btn qty-m" id="qm">−</button>
    <div class="qty-c">
      <div class="qty-n" id="qNum">1</div>
      <div class="qty-l">étiquette(s)</div>
    </div>
    <button class="qty-btn qty-p" id="qp">+</button>
  </div>

  <div class="numpad">
    <button class="nk" data-d="1">1</button>
    <button class="nk" data-d="2">2</button>
    <button class="nk" data-d="3">3</button>
    <button class="nk" data-d="4">4</button>
    <button class="nk" data-d="5">5</button>
    <button class="nk" data-d="6">6</button>
    <button class="nk" data-d="7">7</button>
    <button class="nk" data-d="8">8</button>
    <button class="nk" data-d="9">9</button>
    <button class="nk ghost"></button>
    <button class="nk" data-d="0">0</button>
    <button class="nk del" id="delBtn">⌫</button>
  </div>

  <button class="send off" id="sendBtn" disabled>Saisir un numéro d'OR</button>

  <div class="hist-wrap">
    <div class="hist-hdr">
      <span class="hist-ttl">Historique</span>
      <button class="clr-all" id="clrAll" style="display:none">Effacer tout</button>
    </div>
    <div class="hist-list" id="histList"></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="m-title">⚙ Paramètres</div>
    <label class="m-lbl">URL Google Apps Script</label>
    <input type="text" class="m-in" id="urlIn">
    <button class="m-close" id="mClose">Enregistrer et fermer</button>
  </div>
</div>

<script>
  const DEFAULT_URL = 'https://script.google.com/macros/s/AKfycbz8kQta2W5pmHTeVTiSJXvJS0Rw_Sy_eTr0KNQGktTLHXdpP5vErNtkb9cbfkEduGDJ5A/exec';
  let orStr = '', qty = 1, busy = false;
  const getURL = () => localStorage.getItem('apv_url') || DEFAULT_URL;

  function nowFR() {
    const n = new Date(), p = v => String(v).padStart(2,'0');
    return `${p(n.getDate())}/${p(n.getMonth()+1)}/${n.getFullYear()}  ${p(n.getHours())}:${p(n.getMinutes())}`;
  }
  function relTime(ts) {
    const s = Math.floor((Date.now()-new Date(ts))/1000);
    if(s<60)return s+'s'; if(s<3600)return Math.floor(s/60)+'min';
    if(s<86400)return Math.floor(s/3600)+'h'; return Math.floor(s/86400)+'j';
  }

  function initCells() {
    const w = document.getElementById('orWrap'); w.innerHTML='';
    for(let i=0;i<6;i++){
      const c=document.createElement('div');
      c.id='oc'+i; c.className='or-cell empty'+(i===0?' active':''); c.textContent='·';
      w.appendChild(c);
    }
  }
  function renderCells() {
    for(let i=0;i<6;i++){
      const el=document.getElementById('oc'+i);
      if(i<orStr.length){el.textContent=orStr[i];el.className='or-cell';}
      else if(i===orStr.length){el.textContent='·';el.className='or-cell empty active';}
      else{el.textContent='·';el.className='or-cell empty';}
    }
  }

  /* Aperçu étiquette — OR centré, taille adaptée, pas de placeholder vide */
  function renderLabel() {
    const el = document.getElementById('prevOR');
    document.getElementById('prevDate').textContent = nowFR();
    if(orStr.length===0){
      el.className='lb-or ph';
      el.textContent='— — — — — —';
      el.style.fontSize=''; el.style.letterSpacing='';
      return;
    }
    el.className='lb-or';
    el.textContent=orStr;
    const cfg = [null,
      {f:74,ls:'14px'},{f:74,ls:'12px'},{f:68,ls:'10px'},
      {f:60,ls:'8px'},{f:52,ls:'6px'},{f:44,ls:'4px'}
    ][orStr.length] || {f:44,ls:'4px'};
    el.style.fontSize=cfg.f+'px';
    el.style.letterSpacing=cfg.ls;
  }

  function renderBtn() {
    const btn=document.getElementById('sendBtn');
    if(busy){
      btn.className='send busy';btn.disabled=true;
      btn.innerHTML='<div class="spin"></div>&nbsp;Envoi…';
    } else if(orStr.length>=1){
      btn.className='send ready';btn.disabled=false;
      btn.textContent=`🖨  Imprimer OR ${orStr}`;
    } else {
      btn.className='send off';btn.disabled=true;
      btn.textContent="Saisir un numéro d'OR";
    }
  }

  function render() {
    renderCells(); renderLabel(); renderBtn();
    document.getElementById('qNum').textContent=qty;
  }

  const getH=()=>{try{return JSON.parse(localStorage.getItem('apv_h')||'[]');}catch{return[];}};
  const saveH=h=>localStorage.setItem('apv_h',JSON.stringify(h));
  function renderH() {
    const h=getH(),list=document.getElementById('histList'),clr=document.getElementById('clrAll');
    clr.style.display=h.length?'':'none';
    if(!h.length){list.innerHTML='<div class="hist-empty">Aucun historique</div>';return;}
    list.innerHTML=h.slice().reverse().map((it,ri)=>{
      const idx=h.length-1-ri;
      return `<div class="hi"><div class="hi-dot"></div>
        <span class="hi-or">${it.or}</span>
        <span class="hi-qty">×${it.qty}</span>
        <span class="hi-t">${relTime(it.ts)}</span>
        <button class="hi-del" onclick="delH(${idx})">×</button></div>`;
    }).join('');
  }
  function delH(i){const h=getH();h.splice(i,1);saveH(h);renderH();}
  function addH(or,q){let h=getH();h.push({or,qty:q,ts:new Date().toISOString()});if(h.length>20)h=h.slice(-20);saveH(h);renderH();}

  let tT;
  function showToast(msg,type=''){
    const t=document.getElementById('toast');
    t.className=`toast ${type}`;t.textContent=msg;
    clearTimeout(tT);t.getBoundingClientRect();t.classList.add('show');
    tT=setTimeout(()=>t.classList.remove('show'),3200);
  }

  async function send(){
    if(orStr.length<1||busy)return;
    const or=orStr,q=qty;busy=true;render();
    const ts=new Date().toISOString();
    const url=`${getURL()}?or=${encodeURIComponent(or)}&qty=${q}&magasinier=RC&ts=${encodeURIComponent(ts)}`;
    try{
      await fetch(url,{mode:'no-cors'});
      addH(or,q);showToast(`✓ OR ${or} × ${q} — envoyé`,'ok');
      orStr='';qty=1;
    }catch(e){showToast('✗ Erreur réseau','err');}
    busy=false;render();
  }

  document.querySelector('.numpad').addEventListener('click',e=>{
    const k=e.target.closest('.nk');
    if(!k||k.classList.contains('ghost'))return;
    if(k.id==='delBtn'){orStr=orStr.slice(0,-1);}
    else if(k.dataset.d!==undefined&&orStr.length<6){orStr+=k.dataset.d;}
    k.classList.add('hit');setTimeout(()=>k.classList.remove('hit'),100);
    render();
  });
  document.getElementById('qm').addEventListener('click',()=>{if(qty>1){qty--;render();}});
  document.getElementById('qp').addEventListener('click',()=>{if(qty<99){qty++;render();}});
  document.getElementById('sendBtn').addEventListener('click',send);
  document.getElementById('clrAll').addEventListener('click',()=>{saveH([]);renderH();});

  const ov=document.getElementById('overlay');
  document.getElementById('gearBtn').addEventListener('click',()=>{document.getElementById('urlIn').value=getURL();ov.classList.add('open');});
  const closeM=()=>{localStorage.setItem('apv_url',document.getElementById('urlIn').value.trim()||DEFAULT_URL);ov.classList.remove('open');};
  document.getElementById('mClose').addEventListener('click',closeM);
  ov.addEventListener('click',e=>{if(e.target===ov)closeM();});

  document.addEventListener('keydown',e=>{
    if(ov.classList.contains('open'))return;
    if(e.key>='0'&&e.key<='9'){if(orStr.length<6){orStr+=e.key;render();}}
    else if(e.key==='Backspace'){orStr=orStr.slice(0,-1);render();}
    else if(e.key==='Enter')send();
  });

  setInterval(()=>{renderH();renderLabel();},30000);
  initCells(); render(); renderH();
</script>
</body>
</html>
