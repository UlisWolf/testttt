<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a1a1a">
  <title>APV Rouen – Étiquettes</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue:   #1e44a8;
      --red:    #d42b23;
      --yellow: #f5c000;
      --dark:   #1a1a1a;
      --mid:    #444;
      --light:  #f7f7f7;
      --border: #e0e0e0;
      --radius: 14px;
    }

    html, body {
      height: 100%;
      background: var(--light);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--dark);
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ────────────────────────────────────────── */
    header {
      background: #fff;
      border-bottom: 3px solid var(--blue);
      padding: 16px 20px 12px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }
    header img { height: 48px; }
    .header-text h1 {
      font-size: 17px;
      font-weight: 700;
      color: var(--dark);
      letter-spacing: .3px;
    }
    .header-text p {
      font-size: 12px;
      color: var(--mid);
      margin-top: 2px;
      text-transform: uppercase;
      letter-spacing: .8px;
    }

    /* ── Card ───────────────────────────────────────────── */
    main {
      padding: 24px 16px;
      max-width: 480px;
      margin: 0 auto;
    }

    .card {
      background: #fff;
      border-radius: var(--radius);
      box-shadow: 0 2px 16px rgba(0,0,0,.08);
      padding: 28px 24px 32px;
    }

    .card h2 {
      font-size: 15px;
      font-weight: 700;
      color: var(--mid);
      text-transform: uppercase;
      letter-spacing: .8px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card h2::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 18px;
      border-radius: 2px;
      background: linear-gradient(180deg, var(--blue) 33%, var(--red) 33% 66%, var(--yellow) 66%);
    }

    /* ── Fields ─────────────────────────────────────────── */
    .field { margin-bottom: 20px; }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--mid);
      text-transform: uppercase;
      letter-spacing: .7px;
      margin-bottom: 8px;
    }
    .field input {
      width: 100%;
      height: 58px;
      border: 2px solid var(--border);
      border-radius: 10px;
      font-size: 28px;
      font-weight: 700;
      text-align: center;
      color: var(--dark);
      outline: none;
      transition: border-color .2s;
      letter-spacing: 4px;
      background: #fff;
      -webkit-appearance: none;
    }
    .field input:focus { border-color: var(--blue); }
    .field input::placeholder { color: #ccc; font-size: 20px; letter-spacing: 2px; }

    /* qty field smaller number display */
    #qty { font-size: 36px; letter-spacing: 6px; }

    /* ── Submit ─────────────────────────────────────────── */
    .btn-submit {
      width: 100%;
      height: 64px;
      background: var(--blue);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background .15s, transform .1s;
      -webkit-tap-highlight-color: transparent;
      letter-spacing: .4px;
    }
    .btn-submit:active { background: #1636a0; transform: scale(.98); }
    .btn-submit:disabled { background: #a0a0a0; cursor: default; transform: none; }

    .btn-icon { font-size: 22px; }

    /* ── Status ─────────────────────────────────────────── */
    .status {
      margin-top: 16px;
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 14px;
      font-weight: 600;
      display: none;
      align-items: center;
      gap: 10px;
    }
    .status.ok  { background: #e8f5e9; color: #2e7d32; border: 1.5px solid #a5d6a7; display: flex; }
    .status.err { background: #ffebee; color: #c62828; border: 1.5px solid #ef9a9a; display: flex; }
    .status.loading { background: #e3f2fd; color: #1565c0; border: 1.5px solid #90caf9; display: flex; }

    /* ── History ─────────────────────────────────────────── */
    .history {
      margin-top: 28px;
    }
    .history h3 {
      font-size: 12px;
      font-weight: 700;
      color: var(--mid);
      text-transform: uppercase;
      letter-spacing: .7px;
      margin-bottom: 12px;
    }
    .history-list { list-style: none; }
    .history-list li {
      background: var(--light);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .history-list li .or-num { font-weight: 700; font-family: monospace; letter-spacing: 2px; }
    .history-list li .meta  { font-size: 12px; color: #888; }

    /* ── Footer ─────────────────────────────────────────── */
    footer {
      text-align: center;
      padding: 24px 16px;
      font-size: 11px;
      color: #bbb;
    }
  </style>
</head>
<body>

<header>
  <img id="logo" alt="Mary Automobiles" />
  <div class="header-text">
    <h1>APV Rouen</h1>
    <p>Impression d'étiquettes</p>
  </div>
</header>

<main>
  <div class="card">
    <h2>Nouvelle étiquette</h2>

    <form id="labelForm" novalidate>
      <div class="field">
        <label for="or">Numéro OR</label>
        <input
          id="or"
          name="or"
          type="tel"
          inputmode="numeric"
          pattern="[0-9]{6}"
          maxlength="6"
          placeholder="000000"
          autocomplete="off"
          required
        />
      </div>

      <div class="field">
        <label for="qty">Quantité</label>
        <input
          id="qty"
          name="qty"
          type="tel"
          inputmode="numeric"
          pattern="[0-9]+"
          maxlength="3"
          placeholder="1"
          value=""
          autocomplete="off"
          required
        />
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">
        <span class="btn-icon">🖨️</span>
        Imprimer
      </button>
    </form>

    <div class="status" id="status" role="alert"></div>

    <div class="history" id="historySection" style="display:none">
      <h3>Dernières impressions</h3>
      <ul class="history-list" id="historyList"></ul>
    </div>
  </div>
</main>

<footer>Magasinier : RC &nbsp;·&nbsp; Godex DT4x 105×53mm</footer>

<script>
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbza-arjDM1G-bkWUtM3eqKSMQquQRkYEtxitpS4n2f-SQn7CtHXQDQbJY0mlFI7_9vkgA/exec';
  const MAGASINIER = 'RC';

  const form      = document.getElementById('labelForm');
  const orInput   = document.getElementById('or');
  const qtyInput  = document.getElementById('qty');
  const btn       = document.getElementById('submitBtn');
  const statusEl  = document.getElementById('status');
  const histSec   = document.getElementById('historySection');
  const histList  = document.getElementById('historyList');

  let history = JSON.parse(localStorage.getItem('apv_history') || '[]');
  renderHistory();

  /* Restrict inputs to digits only */
  [orInput, qtyInput].forEach(inp => {
    inp.addEventListener('input', () => {
      inp.value = inp.value.replace(/\D/g, '');
    });
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const orNum = orInput.value.trim();
    const qty   = qtyInput.value.trim();

    /* Validate */
    if (!/^\d{6}$/.test(orNum)) {
      showStatus('err', '⚠️ Le numéro OR doit contenir exactement 6 chiffres.');
      orInput.focus();
      return;
    }
    if (!qty || parseInt(qty) < 1 || parseInt(qty) > 999) {
      showStatus('err', '⚠️ La quantité doit être entre 1 et 999.');
      qtyInput.focus();
      return;
    }

    btn.disabled = true;
    showStatus('loading', '⏳ Envoi en cours…');

    const params = new URLSearchParams({
      or: orNum,
      qty,
      magasinier: MAGASINIER,
      ts: new Date().toISOString()
    });

    try {
      const resp = await fetch(`${APPS_SCRIPT_URL}?${params}`, {
        method: 'GET',
        mode: 'no-cors'
      });

      /* no-cors → opaque response; assume success if no exception */
      addHistory(orNum, qty);
      showStatus('ok', `✅ OR ${orNum} (×${qty}) envoyé à l'impression.`);
      orInput.value = '';
      qtyInput.value = '';
      orInput.focus();
    } catch (err) {
      showStatus('err', '❌ Erreur réseau. Vérifiez votre connexion et réessayez.');
      console.error(err);
    } finally {
      btn.disabled = false;
    }
  });

  function showStatus(type, msg) {
    statusEl.className = 'status ' + type;
    statusEl.textContent = msg;
  }

  function addHistory(orNum, qty) {
    const now = new Date();
    history.unshift({
      or: orNum,
      qty,
      time: now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })
    });
    if (history.length > 10) history = history.slice(0, 10);
    localStorage.setItem('apv_history', JSON.stringify(history));
    renderHistory();
  }

  function renderHistory() {
    if (history.length === 0) { histSec.style.display = 'none'; return; }
    histSec.style.display = 'block';
    histList.innerHTML = history.map(h => `
      <li>
        <span class="or-num">${h.or}</span>
        <span class="meta">×${h.qty} &nbsp; ${h.time}</span>
      </li>
    `).join('');
  }

  /* Embed logo */
  document.getElementById('logo').src =
