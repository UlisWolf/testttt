<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>APV Rouen – Impression étiquettes</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #07080c;
    --card: #111318;
    --gold: #f5c518;
    --green: #16c784;
    --red: #f6465d;
    --text: #ffffff;
    --muted: #9ca3af;
    --r-card: 20px;
    --r-btn: 14px;
    --font: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
    --mono: 'SF Mono', 'Fira Code', monospace;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-bottom: 40px;
  }

  .app {
    width: 100%;
    max-width: 480px;
    padding: 0 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* ── Header ── */
  header {
    width: 100%;
    max-width: 480px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 16px 14px;
    border-bottom: 1.5px solid rgba(245,197,24,0.25);
  }
  .header-left { display: flex; align-items: baseline; gap: 8px; }
  .header-title { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
  .header-sub { font-size: 12px; color: var(--muted); }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .badge-rc {
    background: rgba(245,197,24,0.12);
    border: 1.5px solid var(--gold);
    color: var(--gold);
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 6px;
    letter-spacing: 1px;
  }
  .gear-btn {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 18px;
    padding: 4px;
    border-radius: 8px;
    transition: color 0.2s;
    line-height: 1;
  }
  .gear-btn:hover { color: var(--gold); }

  /* ── OR Display ── */
  .or-display {
    display: flex;
    gap: 8px;
    justify-content: center;
    padding: 4px 0;
  }
  .or-cell {
    width: 48px;
    height: 58px;
    background: var(--card);
    border-radius: 12px;
    border: 1.5px solid rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    font-weight: 700;
    color: var(--text);
    position: relative;
    transition: border-color 0.2s;
  }
  .or-cell.empty { color: rgba(156,163,175,0.4); font-size: 20px; }
  .or-cell.active {
    border-color: var(--gold);
    box-shadow: 0 0 0 2px rgba(245,197,24,0.15);
  }
  .or-cell.active::after {
    content: '';
    position: absolute;
    bottom: 8px;
    width: 18px;
    height: 2px;
    background: var(--gold);
    border-radius: 1px;
    animation: blink 1s step-end infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

  /* ── Label Preview ── */
  .preview-wrap {
    background: var(--card);
    border-radius: var(--r-card);
    padding: 16px;
    display: flex;
    justify-content: center;
  }
  .label-preview {
    width: 210px;
    height: 106px;
    background: #fff;
    border-radius: 6px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.5);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    font-family: var(--font);
    color: #000;
    position: relative;
  }
  .lp-header {
    display: flex;
    align-items: stretch;
    height: 28px;
    flex-shrink: 0;
  }
  .lp-brand {
    flex: 1;
    padding: 3px 6px 2px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .lp-mary { font-size: 11px; font-weight: 900; line-height: 1; color: #000; }
  .lp-auto { font-size: 7px; color: #444; line-height: 1; margin-top: 1px; }
  .lp-rc-box {
    width: 38px;
    border: 2.5px solid #000;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 2px 4px 2px 0;
    font-size: 10px;
    font-weight: 900;
    border-radius: 2px;
  }
  .lp-sep-thick {
    height: 3px;
    background: #000;
    flex-shrink: 0;
  }
  .lp-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 3px 6px 2px;
    gap: 3px;
  }
  .lp-ordre {
    font-size: 5.5px;
    letter-spacing: 2px;
    color: #666;
    text-transform: uppercase;
    font-weight: 500;
  }
  .lp-digits {
    font-size: 26px;
    font-weight: 900;
    letter-spacing: 5px;
    color: #000;
    font-family: var(--mono);
    line-height: 1;
    min-height: 31px;
    display: flex;
    align-items: center;
  }
  .lp-sep-thin {
    height: 1px;
    background: #ccc;
    flex-shrink: 0;
    margin: 0 6px;
  }
  .lp-footer {
    height: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .lp-date {
    font-size: 7px;
    font-family: var(--mono);
    color: #555;
    letter-spacing: 0.5px;
  }

  /* ── Copies ── */
  .copies-row {
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--card);
    border-radius: var(--r-card);
    padding: 14px 20px;
  }
  .qty-btn {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    border: none;
    font-size: 22px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.1s, opacity 0.2s;
    flex-shrink: 0;
  }
  .qty-btn:active { transform: scale(0.9); }
  .qty-minus { background: rgba(255,255,255,0.08); color: var(--text); }
  .qty-plus  { background: rgba(245,197,24,0.18); color: var(--gold); }
  .qty-center {
    flex: 1;
    text-align: center;
  }
  .qty-num {
    font-size: 32px;
    font-weight: 700;
    line-height: 1;
    color: var(--text);
  }
  .qty-label {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }

  /* ── Numpad ── */
  .numpad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .num-key {
    min-height: 64px;
    background: var(--card);
    border: none;
    border-radius: var(--r-btn);
    color: var(--text);
    font-size: 24px;
    font-weight: 600;
    font-family: var(--font);
    cursor: pointer;
    transition: background 0.1s, transform 0.1s;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .num-key:active, .num-key.pressed {
    background: rgba(245,197,24,0.18);
    transform: scale(0.95);
  }
  .num-key.del { font-size: 20px; }
  .num-key.empty-key { background: transparent; pointer-events: none; }

  /* ── Send Button ── */
  .send-btn {
    width: 100%;
    height: 60px;
    border-radius: var(--r-btn);
    border: 2px solid transparent;
    font-size: 17px;
    font-weight: 700;
    font-family: var(--font);
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    letter-spacing: 0.2px;
  }
  .send-btn.ready {
    background: rgba(245,197,24,0.1);
    border-color: var(--gold);
    color: var(--gold);
  }
  .send-btn.ready:active { transform: scale(0.98); }
  .send-btn.disabled {
    background: rgba(255,255,255,0.04);
    border-color: rgba(255,255,255,0.1);
    color: var(--muted);
    cursor: not-allowed;
  }
  .send-btn.loading {
    opacity: 0.7;
    cursor: not-allowed;
  }
  .spinner {
    width: 18px; height: 18px;
    border: 2.5px solid rgba(245,197,24,0.3);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── History ── */
  .history-section { padding-bottom: 8px; }
  .history-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .history-title { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: 0.5px; text-transform: uppercase; }
  .clear-all {
    background: none;
    border: none;
    color: var(--red);
    font-size: 12px;
    cursor: pointer;
    font-family: var(--font);
    padding: 2px 6px;
  }
  .history-list { display: flex; flex-direction: column; gap: 6px; }
  .history-item {
    background: var(--card);
    border-radius: 12px;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .hist-or {
    font-weight: 700;
    font-size: 16px;
    font-family: var(--mono);
    flex: 1;
  }
  .hist-qty {
    font-size: 12px;
    color: var(--muted);
    background: rgba(255,255,255,0.06);
    padding: 2px 8px;
    border-radius: 6px;
  }
  .hist-time { font-size: 11px; color: var(--muted); min-width: 50px; text-align: right; }
  .hist-del {
    background: none;
    border: none;
    color: rgba(255,255,255,0.25);
    font-size: 16px;
    cursor: pointer;
    padding: 0 0 0 4px;
    line-height: 1;
    transition: color 0.2s;
    font-family: var(--font);
  }
  .hist-del:hover { color: var(--red); }
  .history-empty { text-align: center; color: var(--muted); font-size: 13px; padding: 20px 0; }

  /* ── Toast ── */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #1e2028;
    border: 1px solid rgba(255,255,255,0.12);
    color: var(--text);
    padding: 12px 20px;
    border-radius: 14px;
    font-size: 14px;
    font-weight: 500;
    white-space: nowrap;
    z-index: 1000;
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    max-width: calc(100vw - 32px);
    white-space: normal;
    text-align: center;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.success { border-color: var(--green); }
  .toast.error   { border-color: var(--red); }

  /* ── Config Modal ── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 500;
    display: none;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal-sheet {
    background: #1a1d26;
    border-radius: 24px 24px 0 0;
    padding: 24px 20px 40px;
    width: 100%;
    max-width: 480px;
    border-top: 1px solid rgba(255,255,255,0.1);
    animation: slideUp 0.3s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal-title { font-size: 17px; font-weight: 700; margin-bottom: 18px; }
  .modal-label { font-size: 12px; color: var(--muted); margin-bottom: 6px; display: block; }
  .modal-input {
    width: 100%;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px;
    color: var(--text);
    font-size: 12px;
    font-family: var(--mono);
    padding: 10px 12px;
    margin-bottom: 20px;
    outline: none;
    word-break: break-all;
  }
  .modal-input:focus { border-color: var(--gold); }
  .modal-close {
    width: 100%;
    height: 50px;
    background: rgba(245,197,24,0.12);
    border: 1.5px solid var(--gold);
    color: var(--gold);
    border-radius: 14px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    font-family: var(--font);
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <span class="header-title">APV Rouen</span>
    <span class="header-sub">Mary Automobiles</span>
  </div>
  <div class="header-right">
    <span class="badge-rc">RC</span>
    <button class="gear-btn" id="gearBtn" title="Paramètres">⚙</button>
  </div>
</header>

<div class="app">

  <!-- OR display -->
  <div class="or-display" id="orDisplay"></div>

  <!-- Label preview -->
  <div class="preview-wrap">
    <div class="label-preview">
      <div class="lp-header">
        <div class="lp-brand">
          <div class="lp-mary">MARY</div>
          <div class="lp-auto">Automobiles</div>
        </div>
        <div class="lp-rc-box">RC</div>
      </div>
      <div class="lp-sep-thick"></div>
      <div class="lp-body">
        <div class="lp-ordre">O R D R E &nbsp; D E &nbsp; R É P A R A T I O N</div>
        <div class="lp-digits" id="prevOR">_ _ _ _ _ _</div>
      </div>
      <div class="lp-sep-thin"></div>
      <div class="lp-footer">
        <div class="lp-date" id="prevDate"></div>
      </div>
    </div>
  </div>

  <!-- Copies row -->
  <div class="copies-row">
    <button class="qty-btn qty-minus" id="qtyMinus">−</button>
    <div class="qty-center">
      <div class="qty-num" id="qtyNum">1</div>
      <div class="qty-label">étiquette(s)</div>
    </div>
    <button class="qty-btn qty-plus" id="qtyPlus">+</button>
  </div>

  <!-- Numpad -->
  <div class="numpad" id="numpad">
    <button class="num-key" data-d="1">1</button>
    <button class="num-key" data-d="2">2</button>
    <button class="num-key" data-d="3">3</button>
    <button class="num-key" data-d="4">4</button>
    <button class="num-key" data-d="5">5</button>
    <button class="num-key" data-d="6">6</button>
    <button class="num-key" data-d="7">7</button>
    <button class="num-key" data-d="8">8</button>
    <button class="num-key" data-d="9">9</button>
    <button class="num-key empty-key"></button>
    <button class="num-key" data-d="0">0</button>
    <button class="num-key del" id="delKey">←</button>
  </div>

  <!-- Send button -->
  <button class="send-btn disabled" id="sendBtn" disabled>Encore 6 chiffre(s)</button>

  <!-- History -->
  <div class="history-section">
    <div class="history-header">
      <span class="history-title">Historique</span>
      <button class="clear-all" id="clearAll" style="display:none">Effacer tout</button>
    </div>
    <div class="history-list" id="historyList"></div>
  </div>

</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Config Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-sheet">
    <div class="modal-title">⚙ Paramètres</div>
    <label class="modal-label">URL Apps Script</label>
    <input type="text" class="modal-input" id="urlInput" />
    <button class="modal-close" id="modalClose">Fermer</button>
  </div>
</div>

<script>
  const DEFAULT_URL = 'https://script.google.com/macros/s/AKfycbza-arjDM1G-bkWUtM3eqKSMQquQRkYEtxitpS4n2f-SQn7CtHXQDQbJY0mlFI7_9vkgA/exec';
  let orStr = '';
  let qty = 1;
  let sending = false;

  function getURL() {
    return localStorage.getItem('apv_url') || DEFAULT_URL;
  }

  function nowFR() {
    const n = new Date();
    const dd = String(n.getDate()).padStart(2,'0');
    const mm = String(n.getMonth()+1).padStart(2,'0');
    const yyyy = n.getFullYear();
    const hh = String(n.getHours()).padStart(2,'0');
    const mi = String(n.getMinutes()).padStart(2,'0');
    return `${dd}/${mm}/${yyyy}  ${hh}:${mi}`;
  }

  function relativeTime(ts) {
    const diff = Math.floor((Date.now() - new Date(ts).getTime()) / 1000);
    if (diff < 60) return `${diff}s`;
    if (diff < 3600) return `${Math.floor(diff/60)}min`;
    if (diff < 86400) return `${Math.floor(diff/3600)}h`;
    return `${Math.floor(diff/86400)}j`;
  }

  function render() {
    // OR cells
    const display = document.getElementById('orDisplay');
    display.innerHTML = '';
    for (let i = 0; i < 6; i++) {
      const cell = document.createElement('div');
      cell.className = 'or-cell';
      if (i < orStr.length) {
        cell.textContent = orStr[i];
      } else if (i === orStr.length) {
        cell.textContent = '·';
        cell.classList.add('empty', 'active');
      } else {
        cell.textContent = '·';
        cell.classList.add('empty');
      }
      display.appendChild(cell);
    }

    // Label preview
    const prevOR = document.getElementById('prevOR');
    if (orStr.length === 0) {
      prevOR.textContent = '_ _ _ _ _ _';
      prevOR.style.color = '#ccc';
    } else {
      prevOR.textContent = orStr.padEnd(6, '_').split('').join(' ');
      prevOR.style.color = '#000';
    }
    document.getElementById('prevDate').textContent = nowFR();

    // Send button
    const btn = document.getElementById('sendBtn');
    const rem = 6 - orStr.length;
    if (orStr.length === 6 && !sending) {
      btn.className = 'send-btn ready';
      btn.disabled = false;
      btn.innerHTML = `🖨 Imprimer OR ${orStr}`;
    } else if (sending) {
      btn.className = 'send-btn loading';
      btn.disabled = true;
      btn.innerHTML = `<div class="spinner"></div> Envoi en cours…`;
    } else {
      btn.className = 'send-btn disabled';
      btn.disabled = true;
      btn.innerHTML = `Encore ${rem} chiffre(s)`;
    }

    // Copies
    document.getElementById('qtyNum').textContent = qty;
  }

  function getHistory() {
    try { return JSON.parse(localStorage.getItem('apv_history') || '[]'); } catch(e) { return []; }
  }
  function saveHistory(h) {
    localStorage.setItem('apv_history', JSON.stringify(h));
  }

  function renderHistory() {
    const h = getHistory();
    const list = document.getElementById('historyList');
    const clearBtn = document.getElementById('clearAll');
    clearBtn.style.display = h.length ? '' : 'none';
    if (h.length === 0) {
      list.innerHTML = '<div class="history-empty">Aucun historique</div>';
      return;
    }
    list.innerHTML = h.slice().reverse().map((item, ri) => {
      const i = h.length - 1 - ri;
      return `<div class="history-item">
        <span class="hist-or">${item.or}</span>
        <span class="hist-qty">×${item.qty}</span>
        <span class="hist-time">${relativeTime(item.ts)}</span>
        <button class="hist-del" onclick="deleteHistory(${i})">×</button>
      </div>`;
    }).join('');
  }

  function deleteHistory(i) {
    const h = getHistory();
    h.splice(i, 1);
    saveHistory(h);
    renderHistory();
  }

  function addHistory(or, q) {
    let h = getHistory();
    h.push({ or, qty: q, ts: new Date().toISOString() });
    if (h.length > 15) h = h.slice(h.length - 15);
    saveHistory(h);
    renderHistory();
  }

  let toastTimer;
  function showToast(msg, type='') {
    const t = document.getElementById('toast');
    t.className = `toast ${type}`;
    t.textContent = msg;
    clearTimeout(toastTimer);
    // force reflow
    t.getBoundingClientRect();
    t.classList.add('show');
    toastTimer = setTimeout(() => { t.classList.remove('show'); }, 3000);
  }

  async function send() {
    if (orStr.length !== 6 || sending) return;
    const orNow = orStr;
    const qtyNow = qty;
    sending = true;
    render();
    const ts = new Date().toISOString();
    const url = `${getURL()}?or=${encodeURIComponent(orNow)}&qty=${qtyNow}&magasinier=RC&ts=${encodeURIComponent(ts)}`;
    try {
      await fetch(url, { mode: 'no-cors' });
      addHistory(orNow, qtyNow);
      showToast(`✓ Envoyé — OR ${orNow} × ${qtyNow} copie(s)`, 'success');
      orStr = '';
      qty = 1;
    } catch(e) {
      showToast('✗ Erreur réseau', 'error');
    }
    sending = false;
    render();
  }

  // Numpad
  document.getElementById('numpad').addEventListener('click', e => {
    const key = e.target.closest('.num-key');
    if (!key || key.classList.contains('empty-key')) return;
    if (key === document.getElementById('delKey')) {
      orStr = orStr.slice(0, -1);
    } else {
      const d = key.dataset.d;
      if (d !== undefined && orStr.length < 6) orStr += d;
    }
    // press animation
    key.classList.add('pressed');
    setTimeout(() => key.classList.remove('pressed'), 120);
    render();
  });

  // Qty buttons
  document.getElementById('qtyMinus').addEventListener('click', () => { if (qty > 1) { qty--; render(); } });
  document.getElementById('qtyPlus').addEventListener('click', () => { if (qty < 99) { qty++; render(); } });

  // Send
  document.getElementById('sendBtn').addEventListener('click', send);

  // History clear
  document.getElementById('clearAll').addEventListener('click', () => {
    saveHistory([]);
    renderHistory();
  });

  // Config modal
  document.getElementById('gearBtn').addEventListener('click', () => {
    document.getElementById('urlInput').value = getURL();
    document.getElementById('modalOverlay').classList.add('open');
  });
  document.getElementById('modalClose').addEventListener('click', () => {
    localStorage.setItem('apv_url', document.getElementById('urlInput').value.trim() || DEFAULT_URL);
    document.getElementById('modalOverlay').classList.remove('open');
  });
  document.getElementById('modalOverlay').addEventListener('click', e => {
    if (e.target === document.getElementById('modalOverlay')) {
      localStorage.setItem('apv_url', document.getElementById('urlInput').value.trim() || DEFAULT_URL);
      document.getElementById('modalOverlay').classList.remove('open');
    }
  });

  // Keyboard support
  document.addEventListener('keydown', e => {
    if (document.getElementById('modalOverlay').classList.contains('open')) return;
    if (e.key >= '0' && e.key <= '9') {
      if (orStr.length < 6) { orStr += e.key; render(); }
    } else if (e.key === 'Backspace') {
      orStr = orStr.slice(0, -1); render();
    } else if (e.key === 'Enter') {
      send();
    }
  });

  // Refresh history timestamps
  setInterval(renderHistory, 30000);

  // Refresh date in preview every 30s
  setInterval(render, 30000);

  // Init
  render();
  renderHistory();
</script>
</body>
</html>
